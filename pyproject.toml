[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "echo-node"
version = "1.0.0"
description = "Voice agent with interchangeable providers, live-voice AI, and monitoring"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "websockets>=12.0",
]

[project.scripts]
echo-node = "echo_node.cli:main"

[tool.setuptools.packages.find]
include = ["echo_node*"]
