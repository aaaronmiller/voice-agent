# ── Provider-agnostic overrides ─────────────────────────────────────────────
# Every provider/model below can be overridden at runtime by an env var (env
# wins over this file), so LLM/STT/TTS are swappable without editing config:
#   ECHO_LLM_PROVIDER   ECHO_LLM_MODEL   ECHO_LLM_BASE_URL   ECHO_LLM_API_KEY
#   ECHO_STT_PROVIDER   ECHO_STT_MODEL
#   ECHO_TTS_PROVIDER   ECHO_TTS_VOICE
#   ECHO_WAKE_PHRASE
# Examples:
#   ECHO_LLM_PROVIDER=hermes ECHO_LLM_BASE_URL=http://127.0.0.1:8642/v1 ECHO_LLM_MODEL=hermes-agent
#   ECHO_LLM_PROVIDER=ollama ECHO_LLM_MODEL=qwen3:4b
#   ECHO_STT_PROVIDER=faster-whisper ECHO_STT_MODEL=small
#   ECHO_TTS_PROVIDER=kokoro ECHO_TTS_VOICE=af_sky
# Secrets belong in v2/.env (gitignored), not here.
# ─────────────────────────────────────────────────────────────────────────────
assistant:
  name: "Echo Node"
  wake_phrase: "hey rhasspy"
  exit_phrases:
    - "quit"
    - "exit"
    - "stop listening"
  system_prompt: "You are a concise local voice assistant. Keep spoken replies brief."

audio:
  backend: alsa
  sample_rate: 16000
  chunk_size: 1280
  arecord_device: default
  playback_device: default
  input_device: null
  output_device: null

wake_word:
  enabled: true
  sensitivity: 0.35
  pretrained:
    - hey_rhasspy
  model_paths: []

vad:
  provider: silero-openwakeword
  speech_threshold: 0.48
  silence_seconds: 0.85
  max_record_seconds: 18
  min_record_seconds: 0.45
  wake_speech_timeout_seconds: 6
  rms_floor: 350

barge_in:
  enabled: true
  min_speech_seconds: 0.22
  min_playback_age_seconds: 0.45
  resume_false_interruptions: false

hotkeys:
  enabled: true
  terminal_enter: true
  escape_toggle: true

performance:
  preload_stt: true
  warm_tts: true
  warm_backend: false

stt:
  provider: onnx-asr
  model_name: nemo-parakeet-tdt-0.6b-v2
  quantization: int8
  providers:
    - CPUExecutionProvider

llm:
  provider: ollama
  base_url: http://127.0.0.1:11434
  model: ""
  timeout_seconds: 60
  max_history_turns: 8
  keep_alive: 30m

tts:
  provider: kokoro
  voice: af_heart
  speed: 1.0
  model_path: models/kokoro/kokoro-v1.0.onnx
  voices_path: models/kokoro/voices-v1.0.bin
  fallback_provider: espeak-ng
  espeak_voice: en-us
  espeak_speed: 165
  espeak_pitch: 45

# Speech formatting — truncates long replies, summarizes tables, strips markdown.
# Say "be verbose" to get full replies, "be concise" to reset.
speech_format:
  max_sentences: 4
  verbose: false

# Hermes native integration — direct tool access via local API server.
hermes:
  base_url: http://127.0.0.1:8642/v1
  model: hermes-agent
  api_key: ""         # or set HERMES_API_KEY env var
  timeout_seconds: 90

# Pi agent native integration — runs pi as subprocess.
pi_agent:
  command: ["pi", "-p"]
  timeout_seconds: 120

# Floating animated avatar (bottom-right of primary screen) lip-synced to the TTS WAV.
# Requires PyQt6 in the v2 venv and the Rhubarb Lip Sync binary at
# v2/vendor/rhubarb/rhubarb (or on $PATH). Disable by setting enabled: false.
avatar:
  enabled: false
  character: raccoon-hacker     # raccoon-hacker, owl-wizard, axolotl-astronaut, axolotl-helmet, raccoon-cyber
  recognizer: phonetic          # rhubarb recognizer: phonetic (fast) or pocketSphinx
  extended_shapes: GH           # optional extra mouth shapes
  rhubarb_path: null            # null = auto-detect
