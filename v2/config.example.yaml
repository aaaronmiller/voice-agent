# ── Provider-agnostic overrides ─────────────────────────────────────────────
# Every provider/model below can be overridden at runtime by an env var (env
# wins over this file), so LLM/STT/TTS are swappable without editing config:
#   ECHO_LLM_PROVIDER   ECHO_LLM_MODEL   ECHO_LLM_BASE_URL   ECHO_LLM_API_KEY
#   ECHO_STT_PROVIDER   ECHO_STT_MODEL
#   ECHO_TTS_PROVIDER   ECHO_TTS_VOICE
#   ECHO_WAKE_PHRASE
# Examples:
#   ECHO_LLM_PROVIDER=hermes ECHO_LLM_BASE_URL=http://127.0.0.1:8642/v1 ECHO_LLM_MODEL=hermes-agent
#   ECHO_LLM_PROVIDER=ollama ECHO_LLM_MODEL=qwen3:4b
#   ECHO_STT_PROVIDER=faster-whisper ECHO_STT_MODEL=small
#   ECHO_TTS_PROVIDER=kokoro ECHO_TTS_VOICE=af_sky
# Secrets belong in v2/.env (gitignored), not here.
# ─────────────────────────────────────────────────────────────────────────────
assistant:
  name: "Echo Node"
  wake_phrase: "hey rhasspy"
  exit_phrases:
    - "quit"
    - "exit"
    - "stop listening"
  system_prompt: "You are a concise local voice assistant. Keep spoken replies brief."

audio:
  backend: alsa
  # Phase C: WebRTC AEC3 mic capture is registered as audio_io/aec-webrtc
  # (pip install pywebrtc-audio; experimental, ECHO_INCLUDE_EXPERIMENTAL=1),
  # but the orchestrator still constructs MicStream directly — full
  # AecAudioIO wiring (incl. feed_far_end() from the playback path) is
  # follow-up work, so there is no backend: value for it yet.
  sample_rate: 16000
  chunk_size: 1280
  arecord_device: default
  playback_device: default
  input_device: null
  output_device: null

wake_word:
  enabled: true
  sensitivity: 0.35
  pretrained:
    - hey_rhasspy
  model_paths: []

vad:
  provider: openwakeword  # label only; the VAD is OpenWakeWord's VAD + RMS floor
  # Phase C alternative: provider: silero  # real Silero v6 (pip install silero-vad);
  #   experimental (ECHO_INCLUDE_EXPERIMENTAL=1), unverified on hardware.
  speech_threshold: 0.48
  silence_seconds: 0.85
  max_record_seconds: 18
  min_record_seconds: 0.45
  wake_speech_timeout_seconds: 6
  rms_floor: 350

barge_in:
  enabled: true
  min_speech_seconds: 0.22  # debounce: sustained speech before interrupting
  min_playback_age_seconds: 0.45
  # Barge-in hardening (see InterruptibleSpeaker):
  #  - boosted thresholds during playback so speaker bleed can't interrupt
  #    (effective VAD threshold ≈ 0.48*1.8 ≈ 0.86; RMS floor ≈ 350*2.0 = 700)
  playback_threshold_boost: 1.8
  playback_rms_boost: 2.0
  playback_start_grace_s: 0.3  # extra boost in the first 0.3s of each chunk
  bargein_end_grace_s: 0.12  # hysteresis: sustained silence before dropping a pending interrupt
  resume_false_interruptions: false  # vestigial: no longer read by code

hotkeys:
  enabled: true
  terminal_enter: true
  escape_toggle: true

performance:
  preload_stt: true
  warm_tts: true
  warm_backend: false

stt:
  provider: onnx-asr
  # Parakeet TDT v3 0.6B (drop-in upgrade over v2; auto-downloaded by onnx-asr).
  # Falls back to nemo-parakeet-tdt-0.6b-v2 automatically if v3 fails to load.
  model_name: istupakov/parakeet-tdt-0.6b-v3-onnx
  quantization: int8
  providers:
    - CPUExecutionProvider

llm:
  provider: ollama
  base_url: http://127.0.0.1:11434
  model: ""
  timeout_seconds: 60
  max_history_turns: 8
  keep_alive: 30m

tts:
  # Provider: kokoro (default, low-latency ONNX), dots (GPU, expressive),
  # cosyvoice3 (GPU, higher quality + zero-shot cloning; experimental), espeak-ng (CPU fallback).
  # Phase C tiers (experimental, ECHO_INCLUDE_EXPERIMENTAL=1, GPU + hardware validation needed):
  #   qwen3-tts  (Qwen3-TTS-0.6B, streaming, Apache-2.0; pip install qwen-tts)
  #   voxcpn     (VoxCPM-0.5B, expressive prosody, Apache-2.0; pip install voxcpm)
  provider: kokoro
  voice: af_heart
  speed: 1.0
  model_path: models/kokoro/kokoro-v1.0.onnx
  voices_path: models/kokoro/voices-v1.0.bin
  fallback_provider: espeak-ng
  espeak_voice: en-us
  espeak_speed: 165
  espeak_pitch: 45
  # CosyVoice 3 options (only used when provider: cosyvoice3):
  # model_path: models/cosyvoice3-0.5b
  # prompt_wav: path/to/voice-clone-reference.wav
  # prompt_text: "transcript of the reference audio"
  # instruction: "speak cheerfully"
  # language: en
  # Qwen3-TTS options (only used when provider: qwen3-tts; experimental):
  # model_id: Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice  # or a local dir; Base variant for cloning
  # voice: Ryan        # CustomVoice speaker name (see model.get_supported_speakers())
  # language: English
  # instruct: ""        # optional speaking-style instruction
  # device_map: cuda:0
  # dtype: bfloat16
  # VoxCPM options (only used when provider: voxcpn; experimental):
  # model_id: openbmb/VoxCPM       # 0.5B HF id UNVERIFIED — override if wrong
  # cfg_value: 2.0
  # inference_timesteps: 10
  # reference_wav_path: path/to/voice.wav   # optional voice cloning
  # prompt_wav_path: path/to/ref.wav        # optional ultimate cloning
  # prompt_text: "transcript of the prompt"

# Response-generation backend — the agent that answers. Valid providers:
# hermes (default, local tool-use server), pi, claude, codex, openai, openrouter.
# gemini_live and openai_realtime are experimental (voice-native, unverified here).
# llama-swap is experimental (local model router, unverified here).
backend:
  provider: hermes

# Speech formatting — truncates long replies, summarizes tables, strips markdown.
# Say "be verbose" to get full replies, "be concise" to reset.
speech_format:
  max_sentences: 4
  verbose: false

# Hermes native integration — direct tool access via local API server.
hermes:
  base_url: http://127.0.0.1:8642/v1
  model: hermes-agent
  api_key: ""         # or set HERMES_API_KEY env var
  timeout_seconds: 90

# llama-swap local model router (Phase C, experimental) — talks to
# llama-swap's OpenAI-compatible chat-completions endpoint; hot-swaps
# local llama-server models on demand. Select with:
#   backend:
#     provider: llama-swap
# (gated behind ECHO_INCLUDE_EXPERIMENTAL=1 in the settings UI).
llama_swap:
  base_url: http://127.0.0.1:8080
  model: ""            # model id as listed by GET {base_url}/v1/models
  api_key: ""          # or set LLAMA_SWAP_API_KEY env var (usually unneeded)
  timeout_seconds: 90

# Pi agent native integration — runs pi as subprocess.
pi_agent:
  command: ["pi", "-p"]
  timeout_seconds: 120

# Floating animated avatar (bottom-right of primary screen) lip-synced to the TTS WAV.
# Requires PyQt6 in the v2 venv and the Rhubarb Lip Sync binary at
# v2/vendor/rhubarb/rhubarb (or on $PATH). Disable by setting enabled: false.
avatar:
  enabled: false
  character: raccoon-hacker     # raccoon-hacker, owl-wizard, axolotl-astronaut, axolotl-helmet, raccoon-cyber
  recognizer: phonetic          # rhubarb recognizer: phonetic (fast) or pocketSphinx
  extended_shapes: GH           # optional extra mouth shapes
  rhubarb_path: null            # null = auto-detect
  # Phase C: a LiveTalking-style harness around the MuseTalk prototype is
  # registered as avatar/musetalk-livetalking (experimental,
  # ECHO_INCLUDE_EXPERIMENTAL=1; needs CUDA + models/manifest.json + face photo).
  # It is not wired into the pipeline's avatar path yet (that still uses the
  # rhubarb controller above) — Phase D work.

# ── External providers (Phase B) ──────────────────────────────────────
# Any program speaking the JSON-RPC 2.0 adapter protocol on stdio can take
# a slot's place (spec: echo_node/adapters/PROTOCOL.md). Entries are
# declared HERE — the config file is the trust boundary. The settings UI
# never accepts executable paths; it only lists validated providers.
#
# external_providers:
#   # whisper.cpp STT via the shipped reference adapter.
#   - slot: stt
#     name: whispercpp
#     command: ["builtin:stt_whispercpp.py"]   # builtin:<file> = repo-shipped
#     args: ["--model", "/models/ggml-base.bin", "--binary", "whisper-cli"]
#     label: "whisper.cpp (external)"
#     request_timeout_s: 60.0
#     idle_timeout_s: 120.0
#     max_restarts: 3
#
#   # Piper TTS via the shipped reference adapter.
#   - slot: tts
#     name: piper
#     command: ["builtin:tts_piper.py"]
#     args: ["--model", "/models/en_US-amy-medium.onnx"]
#     label: "Piper (external)"
#
#   # A third-party adapter: explicit argv, resolved from $PATH like any
#   # other subprocess. No `builtin:` magic — the config file says exactly
#   # what runs.
#   - slot: agent_backend
#     name: my-agent
#     command: ["/opt/my-agent/bin/adapter", "--config", "/etc/my-agent.yaml"]
#     label: "My agent (external)"
#     experimental: true
#
#   # Wyoming TCP adapters (Phase D): any Wyoming-protocol server on the
#   # network can take a slot — no `command:` is spawned; the adapter only
#   # opens a TCP connection per request. Conventional ports are the
#   # projects' documented defaults (confirm against the server you run):
#   # wyoming-faster-whisper 10300 (stt), wyoming-piper 10200 (tts),
#   # wyoming-openwakeword 10400 (wake_word). `host` defaults to 127.0.0.1.
#   - slot: stt
#     name: wy-faster-whisper
#     transport: tcp
#     port: 10300
#     model: tiny-int8     # optional: sent as `name` in the `transcribe` event
#     language: en         # optional: sent as `language`
#     label: "faster-whisper (wyoming)"
#     request_timeout_s: 60.0
#
#   - slot: tts
#     name: wy-piper
#     transport: tcp
#     port: 10200
#     voice_name: en_US-amy-medium   # optional: `voice: {name}` in `synthesize`
#     # voice_speaker: ...          # optional: rides along with voice_name
#     label: "Piper (wyoming)"
#
#   - slot: wake_word
#     name: wy-openwakeword
#     transport: tcp
#     port: 10400
#     phrase_names: ["hey_jarvis"]  # optional: `names` in the `detect` event
#     label: "openWakeWord (wyoming)"
#
# Rules: `name` must be unique per slot (collisions with built-ins are a
# startup error); `transport` is `subprocess` (default) or `tcp`.
# Subprocess entries: `slot` must be one of stt, tts, vad, wake_word,
# agent_backend (avatar/audio_io/barge_in are not subprocess-servable);
# `command[0]` may be `builtin:<file>` only for the shipped adapters in
# echo_node/adapters/ (no "..", no separators, exact name).
# TCP entries: `slot` must be one of stt, tts, wake_word (the Wyoming
# protocol has no per-chunk VAD query); `host` (default 127.0.0.1) and
# `port` (required) select the server; `command`/`args` are forbidden.
# Any schema violation fails startup with a plain message.
